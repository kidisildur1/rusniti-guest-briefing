<!-- ================================================================
     EMPLOYEE MODULE: emp_module.js
     ================================================================ -->
<script>
(function() {
  'use strict';
  var K_MOD_PROG = 'tmk_mod_prog';
  function lsG(k, fb) { try { var v=localStorage.getItem(k); if(v===null)return(fb!==undefined?fb:null); return JSON.parse(v); } catch(e) { return(fb!==undefined?fb:null); } }
  function lsS(k, v)  { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
  function esc(s)     { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function $(sel)     { return document.querySelector(sel); }
  function pad(n)     { return String(n).padStart(2,'0'); }
  function fmtDt(d)   { return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

  var ICON_MAP = {
    'zap':'⚡','alert':'⚠️','flask':'🧪','fire':'🔥','burn':'🌡️','check':'✅','book':'📖',
    'brush':'✨','shield':'🛡️','vest':'🦺','search':'🔍','ban':'🚫','power':'🔌',
    'glasses':'🥽','hard-hat':'⛑️','drop':'💧','bell':'🔔','phone':'📞','user':'👤',
    'heart':'❤️','glove':'🧤','headphones':'🎧','monitor':'🖥️','body':'🧍','eye':'👁️',
    'map':'📍','bulb':'💡','fence':'🚧','tag':'🏷️','fork':'🍽️','hand':'🤲',
    'ice':'🌨️','ok':'✅'
  };
  function getIcon(name) { return '<span class="card-emoji-wrap">'+(ICON_MAP[name]||'•')+'</span>'; }

  var CARD_TYPE = {
    'rule': { label:'ПРАВИЛО',  cls:'sc-rule' },
    'ban':  { label:'ЗАПРЕТ',   cls:'sc-ban'  },
    'warn': { label:'ОПАСНОСТЬ',cls:'sc-warn' },
    'ok':   { label:'ОК',       cls:'sc-ok'   }
  };

  function renderSafetyCard(card) {
    var t = CARD_TYPE[card.type] || CARD_TYPE['rule'];
    var badgeSvg = card.type==='ban'
      ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>'
      : card.type==='ok'
        ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
        : card.type==='warn'
          ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
          : '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
    return '<div class="safety-card '+t.cls+'">'
      +'<div class="safety-card-icon">'+getIcon(card.icon)+'</div>'
      +'<div class="safety-card-title">'+esc(card.title)+'</div>'
      +'<div class="safety-card-sub">'+esc(card.sub)+'</div>'
      +'<div class="safety-card-badge '+t.cls+'-badge">'+badgeSvg+' '+t.label+'</div>'
      +'</div>';
  }

  function getModuleData(instId) {
    if (!window.EMP_MODULES) return null;
    for (var deptId in window.EMP_MODULES) {
      var arr = window.EMP_MODULES[deptId];
      for (var i=0;i<arr.length;i++) { if(arr[i].id===instId) return arr[i]; }
    }
    return null;
  }

  function getProg(instId) {
    var all = lsG(K_MOD_PROG, {});
    return all[instId] || { slides:[], testScore:null, testDone:false, done:false, dt:null, videoWatched:false };
  }
  function saveProg(instId, prog) {
    var all = lsG(K_MOD_PROG, {});
    all[instId] = prog;
    lsS(K_MOD_PROG, all);
  }

  window.showEmployeeModuleFull = function(dept, instObj, onBack) {
    var instId = instObj ? instObj.id : null;
    var modData = instId ? getModuleData(instId) : null;
    if (!modData) { showModulePlaceholder(dept, instObj, onBack); return; }
    showModuleVideo(modData, dept, onBack);
  };

  function buildProgressHtml(mod, prog) {
    var totalSteps = 1 + mod.slides.length + 1;
    var doneSteps = (prog.videoWatched?1:0) + prog.slides.length + (prog.testDone?1:0);
    var pct = Math.round(doneSteps / totalSteps * 100);
    var dotsHtml = '<div class="flow-dot '+(prog.videoWatched?'done':'active')+'" title="Видео">'+(prog.videoWatched?'✓':'▶')+'</div>';
    for (var di=0;di<mod.slides.length;di++) {
      var isDone = prog.slides.indexOf(mod.slides[di].id)!==-1;
      dotsHtml += '<div class="flow-dot '+(isDone?'done':'')+'" title="Слайд '+(di+1)+'">'+(isDone?'✓':(di+1))+'</div>';
    }
    dotsHtml += '<div class="flow-dot '+(prog.testDone?'done':'')+'" title="Тест" style="'+(prog.testDone?'':'background:var(--blue-bg);border-color:var(--blue);color:var(--blue)')+'">📝</div>';
    return '<div class="flow-stepper"><div class="flow-stepper-top"><span class="flow-stepper-label">Прогресс</span><span class="flow-stepper-pct">'+pct+'%</span></div><div class="flow-bar-outer"><div class="flow-bar-inner" style="width:'+pct+'%"></div></div><div class="flow-dots">'+dotsHtml+'</div></div>';
  }

  function showModuleVideo(mod, dept, onBack) {
    var app = document.getElementById('app');
    var prog = getProg(mod.id);
    if (window._tmkSetBreadcrumb) {
      window._tmkSetBreadcrumb([
        {label:'Главная', onClick:function(){if(window._tmkShowHome)window._tmkShowHome();}},
        {label:'Отдел',   onClick:function(){if(window._tmkShowEmpDept)window._tmkShowEmpDept();}},
        {label:mod.icon+' '+mod.name}
      ]);
    }
    var videoHtml = '';
    if (mod.video && (mod.video.indexOf('youtube')!==-1||mod.video.indexOf('youtu.be')!==-1)) {
      videoHtml = '<div style="position:relative;padding-bottom:56.25%;height:0;border-radius:var(--r-lg);overflow:hidden">'
        +'<iframe src="'+esc(mod.video)+'" style="position:absolute;inset:0;width:100%;height:100%;border:none" allowfullscreen></iframe>'
        +'</div>'
        +'<div class="info-box mt-8" style="margin-bottom:0">Просмотрите видео до конца, затем нажмите кнопку ниже.</div>';
    } else if (mod.video) {
      videoHtml = '<video id="modVideo" controls controlsList="nodownload" style="width:100%;border-radius:var(--r-lg);background:#000;max-height:260px">'
        +'<source src="'+esc(mod.video)+'" type="video/mp4"></video>';
    } else {
      videoHtml = '<div class="video-placeholder">'
        +'<div class="vp-icon" id="vpIcon">▶</div>'
        +'<div class="vp-title">'+esc(mod.name)+'</div>'
        +'<div class="vp-sub">Видеоинструктаж по установке</div>'
        +'<div class="vp-timer hidden" id="vpTimer"><div class="vp-timer-bar"><div class="vp-timer-fill" id="vpFill"></div></div><span id="vpSec">5</span> сек. до завершения</div>'
        +'<button class="vp-play-btn" id="vpPlayBtn" type="button">▶ Начать просмотр</button>'
        +'<div class="vp-note">Видео будет добавлено позже. Нажмите для демо.</div>'
        +'</div>';
    }

    app.innerHTML = '<div class="page">'
      +'<div class="page-head"><div class="page-head-eyebrow"><span>'+mod.icon+'</span> '+esc(mod.iot)+'</div>'
      +'<div class="page-head-title">'+esc(mod.name)+'</div>'
      +'<div class="page-head-sub">Видеоинструктаж по установке</div></div>'
      +buildProgressHtml(mod,prog)
      +'<div class="slide-block" style="overflow:hidden">'+videoHtml+'</div>'
      +'<div style="height:80px"></div></div>'
      +'<div class="sticky-bottom no-print"><div class="sticky-bottom-inner">'
      +'<button class="btn btn-secondary" id="btnBackV">← Назад</button>'
      +'<button class="btn btn-primary" id="btnWatched" class="btn-grow" '+(prog.videoWatched?'':'disabled')+'>К слайдам →</button>'
      +'</div></div>';

    var playBtn = $('#vpPlayBtn');
    var vpIcon  = $('#vpIcon');
    if (playBtn) {
      playBtn.addEventListener('click', function() {
        playBtn.style.display='none';
        var vpTimer = $('#vpTimer'); if(vpTimer) vpTimer.classList.remove('hidden');
        var vpFill = $('#vpFill'); var vpSec = $('#vpSec');
        var total=5, elapsed=0;
        var iv = setInterval(function() {
          elapsed++;
          if(vpFill) vpFill.style.width=(elapsed/total*100)+'%';
          if(vpSec) vpSec.textContent=total-elapsed;
          if(elapsed>=total) {
            clearInterval(iv);
            var p=getProg(mod.id); p.videoWatched=true; saveProg(mod.id,p);
            var btn=$('#btnWatched'); if(btn) btn.removeAttribute('disabled');
            if(vpIcon) vpIcon.textContent='✓';
            var tm=$('#vpTimer'); if(tm) tm.innerHTML='<span style="color:var(--green);font-weight:800;">✓ Просмотрено</span>';
          }
        },1000);
      });
    }
    $('#btnWatched').addEventListener('click', function(){ showModuleSlide(mod,0,dept,onBack); });
    $('#btnBackV').addEventListener('click', function(){ if(onBack) onBack(); });
    scrollTop();
  }

  function showModuleSlide(mod, slideIdx, dept, onBack) {
    var app = document.getElementById('app');
    var prog = getProg(mod.id);
    var slide = mod.slides[slideIdx];
    var confirmed = prog.slides.indexOf(slide.id)!==-1;

    if (window._tmkSetBreadcrumb) {
      window._tmkSetBreadcrumb([
        {label:'Главная', onClick:function(){if(window._tmkShowHome)window._tmkShowHome();}},
        {label:'Отдел',   onClick:function(){if(window._tmkShowEmpDept)window._tmkShowEmpDept();}},
        {label:mod.icon+' '+mod.name, onClick:function(){showModuleVideo(mod,dept,onBack);}},
        {label:'Слайд '+(slideIdx+1)}
      ]);
    }

    var cardsHtml = '<div class="slide-cards-grid">';
    for (var ci=0;ci<slide.cards.length;ci++) { cardsHtml+=renderSafetyCard(slide.cards[ci]); }
    cardsHtml += '</div>';

    app.innerHTML = '<div class="page">'
      +'<div class="page-head"><div class="page-head-eyebrow">'+mod.icon+' '+esc(mod.name)+'</div>'
      +'<div class="page-head-title">'+esc(slide.title)+'</div></div>'
      +buildProgressHtml(mod,prog)
      +'<div class="slide-block">'
      +'<div class="slide-block-head"><div class="slide-block-num">'+(slideIdx+1)+'</div><div class="slide-block-title">'+esc(slide.title)+'</div></div>'
      +'<div>'+cardsHtml+'</div>'
      +'<div class="slide-footer">'
      +'<div class="confirm-row '+(confirmed?'':'locked')+'" id="confirmRow">'
      +'<input type="checkbox" class="confirm-check" id="confirmCheck"'+(confirmed?' checked':'')+(confirmed?'':' disabled')+'>'
      +'<label class="confirm-label" for="confirmCheck">Ознакомлен с разделом</label>'
      +'</div></div></div>'
      +'<div style="height:80px"></div></div>'
      +'<div class="sticky-bottom no-print"><div class="sticky-bottom-inner">'
      +'<button class="btn btn-secondary" id="btnPrev">← Назад</button>'
      +'<button class="btn btn-primary" id="btnNext" class="btn-grow" '+(confirmed?'':'disabled')+'>'
      +(slideIdx<mod.slides.length-1?'Следующий →':'К тесту →')
      +'</button></div></div>';

    var confirmRow=$('#confirmRow'); var confirmChk=$('#confirmCheck'); var btnNext=$('#btnNext');
    if (!confirmed) {
      setTimeout(function() {
        confirmRow.classList.remove('locked'); confirmChk.removeAttribute('disabled');
      }, 300);
    }
    confirmChk.addEventListener('change', function() {
      if (this.checked) {
        var p=getProg(mod.id);
        if(p.slides.indexOf(slide.id)===-1){p.slides.push(slide.id);saveProg(mod.id,p);}
        btnNext.removeAttribute('disabled');
      } else { btnNext.setAttribute('disabled',''); }
    });
    $('#btnPrev').addEventListener('click', function() {
      if(slideIdx>0) showModuleSlide(mod,slideIdx-1,dept,onBack);
      else showModuleVideo(mod,dept,onBack);
    });
    $('#btnNext').addEventListener('click', function() {
      if(slideIdx<mod.slides.length-1) showModuleSlide(mod,slideIdx+1,dept,onBack);
      else showModuleTest(mod,dept,onBack);
    });
    scrollTop();
  }

  function showModuleTest(mod, dept, onBack) {
    var app = document.getElementById('app');
    var questions = mod.test.slice(0, 5);
    var answers = new Array(questions.length).fill(-1);

    if (window._tmkSetBreadcrumb) {
      window._tmkSetBreadcrumb([
        {label:'Главная', onClick:function(){if(window._tmkShowHome)window._tmkShowHome();}},
        {label:mod.icon+' '+mod.name, onClick:function(){showModuleSlide(mod,0,dept,onBack);}},
        {label:'Тест'}
      ]);
    }

    function renderTest() {
      var qHtml = '';
      for (var i=0;i<questions.length;i++) {
        var q=questions[i]; var userA=answers[i];
        var optHtml = '';
        for (var j=0;j<q.options.length;j++) {
          var sel = userA===j ? 'selected' : '';
          optHtml+='<label class="test-option '+sel+'" data-qi="'+i+'" data-oi="'+j+'">'
            +'<span class="test-option-radio">'+(userA===j?'•':'')+'</span>'
            +'<span class="test-option-text">'+esc(q.options[j])+'</span>'
            +'</label>';
        }
        qHtml+='<div class="test-question"><div class="test-q-head"><div class="test-q-num">Вопрос '+(i+1)+' из '+questions.length+'</div><div class="test-q-text">'+esc(q.q)+'</div></div><div class="test-options">'+optHtml+'</div></div>';
      }
      var allAnswered = answers.every(function(a){return a!==-1;});
      app.innerHTML='<div class="page">'
        +'<div class="page-head"><div class="page-head-eyebrow">'+mod.icon+' '+esc(mod.name)+'</div>'
        +'<div class="page-head-title">Итоговый тест</div>'
        +'<div class="page-head-sub">Необходимо правильно ответить на 4 из 5 вопросов</div></div>'
        +'<div class="warn-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Выберите один правильный ответ на каждый вопрос.</div>'
        +qHtml
        +'<div style="height:80px"></div></div>'
        +'<div class="sticky-bottom no-print"><div class="sticky-bottom-inner">'
        +'<button class="btn btn-secondary" id="btnBackSlides">← Слайды</button>'
        +'<button class="btn btn-primary" id="btnSubmit" class="btn-grow" '+(allAnswered?'':'disabled')+'>Завершить тест</button>'
        +'</div></div>';

      app.querySelectorAll('.test-option').forEach(function(el) {
        el.addEventListener('click', function() {
          var qi=parseInt(this.dataset.qi); var oi=parseInt(this.dataset.oi);
          answers[qi]=oi; renderTest();
        });
      });
      var sub=$('#btnSubmit');
      if(sub) sub.addEventListener('click', function(){ submitTest(); });
      $('#btnBackSlides').addEventListener('click', function(){ showModuleSlide(mod,0,dept,onBack); });
    }

    function submitTest() {
      var correct=0;
      for(var i=0;i<questions.length;i++){if(answers[i]===questions[i].correct)correct++;}
      var passed=correct>=4;
      showTestResult(mod,questions,answers,correct,passed,dept,onBack);
    }
    renderTest(); scrollTop();
  }

  function showTestResult(mod, questions, answers, correct, passed, dept, onBack) {
    var app = document.getElementById('app');
    var reviewHtml='';
    for(var i=0;i<questions.length;i++){
      var q=questions[i]; var userA=answers[i]; var isOk=userA===q.correct;
      var optHtml='';
      for(var j=0;j<q.options.length;j++){
        var cls=''; if(j===q.correct)cls='correct'; else if(j===userA&&!isOk)cls='wrong';
        optHtml+='<div class="test-option '+cls+'" style="pointer-events:none">'
          +'<span class="test-option-radio">'+(j===q.correct?'✓':(j===userA&&!isOk?'✗':'○'))+'</span>'
          +'<span class="test-option-text">'+esc(q.options[j])+'</span>'
          +'</div>';
      }
      reviewHtml+='<div class="test-question"><div class="test-q-head"><div class="test-q-num">Вопрос '+(i+1)+'</div><div class="test-q-text">'+esc(q.q)+'</div></div><div class="test-options">'+optHtml+'</div></div>';
    }
    if(passed){
      var p=getProg(mod.id); p.testScore=correct; p.testDone=true; p.done=true; p.dt=fmtDt(new Date()); saveProg(mod.id,p);
    }
    app.innerHTML='<div class="page">'
      +'<div style="text-align:center;padding:16px 0 8px">'
      +(passed
        ?'<div style="width:72px;height:72px;background:var(--green-bg);border:2.5px solid var(--green);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--green);animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) both"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>'
        :'<div style="width:72px;height:72px;background:var(--red-bg);border:2.5px solid var(--red);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--red)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>')
      +'<div class="page-head-title">'+(passed?'Тест пройден! 🎉':'Тест не пройден')+'</div>'
      +'<div style="margin-top:6px"><span class="badge '+(passed?'badge-green':'badge-red')+'">'+correct+' из '+questions.length+' правильных ответов</span></div>'
      +'</div>'
      +(!passed?'<div class="warn-box mt-12">Для прохождения необходимо не менее 4 правильных ответов. Повторите слайды.</div>':'')
      +'<div style="margin:16px 0">'+reviewHtml+'</div>'
      +'<div style="height:80px"></div></div>'
      +'<div class="sticky-bottom no-print"><div class="sticky-bottom-inner">'
      +'<button class="btn btn-secondary" id="btnRetry">'+(passed?'← Слайды':'↩ Повторить')+'</button>'
      +(passed?'<button class="btn btn-success" id="btnCert" class="btn-grow">🏆 Сертификат</button>':'')
      +'</div></div>';

    $('#btnRetry').addEventListener('click', function(){ showModuleSlide(mod,0,dept,onBack); });
    var btnCert=$('#btnCert');
    if(btnCert) btnCert.addEventListener('click', function(){ showModuleCert(mod,correct,dept,onBack); });
    scrollTop();
  }

  function showModuleCert(mod, score, dept, onBack) {
    var app = document.getElementById('app');
    var prog = getProg(mod.id);
    var empProf = lsG('tmk_emp_prof',{});
    var dt = prog.dt || fmtDt(new Date());
    if (window._tmkSetBreadcrumb) {
      window._tmkSetBreadcrumb([
        {label:'Главная', onClick:function(){if(window._tmkShowHome)window._tmkShowHome();}},
        {label:mod.icon+' '+mod.name, onClick:function(){showModuleSlide(mod,0,dept,onBack);}},
        {label:'Сертификат'}
      ]);
    }
    app.innerHTML='<div class="page">'
      +'<div style="text-align:center;padding:12px 0 20px">'
      +'<div style="width:72px;height:72px;background:var(--green-bg);border:2.5px solid var(--green);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--green);animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) both"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>'
      +'<div class="page-head-title">Обучение завершено!</div>'
      +'<div style="margin-top:6px"><span class="badge badge-green">✓ Все разделы и тест пройдены</span></div>'
      +'</div>'
      +'<div class="receipt-card mt-16">'
      +'<div class="receipt-row"><span class="receipt-key">Установка</span><span class="receipt-val">'+mod.icon+' '+esc(mod.name)+'</span></div>'
      +'<div class="receipt-row"><span class="receipt-key">Инструкция</span><span class="receipt-val">'+esc(mod.iot)+'</span></div>'
      +'<div class="receipt-row"><span class="receipt-key">Результат теста</span><span class="receipt-val" style="color:var(--green)">'+score+' из 5 правильных ✓</span></div>'
      +'<div class="receipt-row"><span class="receipt-key">Дата</span><span class="receipt-val">'+esc(dt)+'</span></div>'
      +'</div>'
      +'<div class="form-block">'
      +'<div class="form-block-title">Данные сотрудника</div>'
      +'<div class="form-group"><label class="form-label" for="cname">ФИО <span class="req">*</span></label><input class="form-input" id="cname" type="text" placeholder="Иванов Иван Иванович" value="'+esc(empProf.name||'')+'"></div>'
      +'<div class="form-group"><label class="form-label" for="ctab">Табельный номер</label><input class="form-input" id="ctab" type="text" placeholder="12345" value="'+esc(empProf.tab||'')+'"></div>'
      +'<div class="form-group"><label class="form-label">Подразделение</label><input class="form-input" type="text" value="'+esc(dept)+'" readonly></div>'
      +'<div class="form-group"><label class="form-label">Дата и время</label><input class="form-input" type="text" value="'+esc(dt)+'" readonly></div>'
      +'</div>'
      +'<div class="info-box">Укажите ФИО и распечатайте сертификат для подтверждения прохождения.</div>'
      +'<div style="height:80px"></div></div>'
      +'<div class="sticky-bottom no-print"><div class="sticky-bottom-inner">'
      +'<button class="btn btn-secondary" id="btnHomeC">На главную</button>'
      +'<button class="btn btn-primary" id="btnPrintC" class="btn-grow">🖨️ Распечатать</button>'
      +'</div></div>';

    ['cname','ctab'].forEach(function(id) {
      var el=document.getElementById(id);
      if(el) el.addEventListener('input', function(){
        var p2=lsG('tmk_emp_prof',{}); if(id==='cname')p2.name=this.value.trim(); if(id==='ctab')p2.tab=this.value.trim(); lsS('tmk_emp_prof',p2);
      });
    });
    $('#btnHomeC').addEventListener('click', function(){ if(window._tmkShowHome) window._tmkShowHome(); });
    $('#btnPrintC').addEventListener('click', function(){
      var nm=document.getElementById('cname').value.trim();
      if(!nm){alert('Пожалуйста, укажите ФИО.'); return;}
      var p2=lsG('tmk_emp_prof',{}); p2.name=nm; lsS('tmk_emp_prof',p2);
      var w=window.open('','_blank','width=820,height=700');
      w.document.write('<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Сертификат</title>'
        +'<style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111;max-width:680px;margin:36px auto;padding:0 20px;line-height:1.5}'
        +'h1{font-size:16pt;margin:0 0 3px}.sub{color:#555;font-size:11pt;margin-bottom:18px}.divider{border-top:2px solid #111;margin:16px 0}'
        +'.t{width:100%;border-collapse:collapse;margin-bottom:16px}.t td{padding:7px 10px;border:1px solid #ccc}'
        +'.t td:first-child{background:#f5f5f5;font-weight:bold;width:200px}'
        +'.sign-area{display:flex;gap:40px;margin-top:36px}.sign-box{flex:1;border-top:1px solid #111;padding-top:5px;font-size:9.5pt;color:#555}'
        +'.footer{margin-top:24px;font-size:8pt;color:#999;text-align:center}</style>'
        +'</head><body>'
        +'<h1>ООО «ИЦ ТМК»</h1><div class="sub">Сертификат о прохождении инструктажа по охране труда</div><div class="divider"></div>'
        +'<table class="t">'
        +'<tr><td>ФИО</td><td><strong>'+nm+'</strong></td></tr>'
        +'<tr><td>Табельный №</td><td>'+(document.getElementById('ctab').value||'—')+'</td></tr>'
        +'<tr><td>Установка</td><td>'+mod.name+'</td></tr>'
        +'<tr><td>Инструкция</td><td>'+mod.iot+'</td></tr>'
        +'<tr><td>Результат</td><td><strong style="color:green">'+score+' из 5 правильных</strong></td></tr>'
        +'<tr><td>Дата</td><td>'+dt+'</td></tr>'
        +'<tr><td>Статус</td><td><strong style="color:green">✓ Обучение пройдено</strong></td></tr>'
        +'</table>'
        +'<div class="sign-area"><div class="sign-box">Подпись сотрудника<br><br>_________________________</div><div class="sign-box">Подпись ответственного<br><br>_________________________</div></div>'
        +'<div class="footer">Документ сформирован автоматически. ООО «ИЦ ТМК» — система обучения по охране труда.</div>'
        +'</body></html>');
      w.document.close(); w.focus(); setTimeout(function(){w.print();},500);
    });
    scrollTop();
  }

  function showModulePlaceholder(dept, instObj, onBack) {
    var app = document.getElementById('app');
    var instName = instObj ? instObj.name : 'Установка';
    var prof = lsG('tmk_emp_prof',{});
    app.innerHTML='<div class="page">'
      +'<div class="page-head"><div class="page-head-title">'+esc(instName)+'</div>'
      +(prof&&prof.name?'<div class="page-head-sub">Сотрудник: <strong>'+esc(prof.name)+'</strong></div>':'')
      +'</div>'
      +'<div class="module-card"><div class="module-card-head"><div class="module-card-title">'+esc(dept)+'</div><div class="module-card-sub">'+esc(instName)+'</div></div>'
      +'<div class="module-card-body"><div class="info-box">Контент модуля находится в разработке.</div>'
      +'<div class="module-steps-list"><div class="module-step"><div class="module-step-n">1</div><div class="module-step-label">Карточки безопасности</div></div><div class="module-step"><div class="module-step-n">2</div><div class="module-step-label">Проверочный тест</div></div><div class="module-step"><div class="module-step-n">3</div><div class="module-step-label">Сертификат</div></div></div>'
      +'</div></div><div style="height:80px"></div></div>'
      +'<div class="sticky-bottom no-print"><div class="sticky-bottom-inner">'
      +'<button class="btn btn-secondary" id="btnBackI2">← Назад</button>'
      +'<button class="btn btn-ghost" id="btnHomeM2">На главную</button>'
      +'</div></div>';
    document.getElementById('btnBackI2').addEventListener('click', function(){ if(onBack) onBack(); });
    document.getElementById('btnHomeM2').addEventListener('click', function(){ if(window._tmkShowHome) window._tmkShowHome(); });
    window.scrollTo({top:0,behavior:'smooth'});
  }
})();
</script>
